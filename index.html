<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서류발급 비서 - 든든이</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #f4f6f9;
            overflow: hidden;
        }

        /* [좌측 창] 대형 안내 및 컨트롤 영역 */
        .guide-panel {
            width: 38%;
            background-color: #ffffff;
            border-right: 2px solid #e2e8f0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 5px 0 15px rgba(0,0,0,0.05);
            z-index: 10;
            transition: width 0.3s ease;
        }

        .guide-panel.full-width {
            width: 100%;
            border-right: none;
        }

        .header {
            border-bottom: 4px solid #1D9E75;
            padding-bottom: 20px;
            cursor: pointer;
            user-select: none;
        }

        .header h1 {
            font-size: 28px;
            color: #005088;
            line-height: 1.3;
        }

        .step-info {
            flex-grow: 1;
            margin-top: 30px;
        }

        .step-number {
            font-size: 24px;
            font-weight: bold;
            color: #1D9E75;
            margin-bottom: 15px;
        }

        .step-instruction {
            font-size: 25px;
            font-weight: 800;
            color: #1e293b;
            line-height: 1.6;
            word-break: keep-all;
            white-space: pre-wrap;
        }

        .orange {
            color: #E65100;
            font-weight: 900;
        }

        /* 홈 대형 서류 선택 카드 */
        .home-menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-top: 40px;
            margin-bottom: 30px;
        }

        .menu-card {
            background-color: #f8fafc;
            border: 3px solid #cbd5e1;
            border-radius: 20px;
            padding: 40px 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.04);
        }

        .menu-card:hover {
            border-color: #1D9E75;
            background-color: #f0fdf4;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(29, 158, 117, 0.15);
        }

        .menu-card .card-icon {
            font-size: 55px;
            margin-bottom: 20px;
        }

        .menu-card .card-title {
            font-size: 28px;
            font-weight: 900;
            color: #005088;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .menu-card .card-desc {
            font-size: 19px;
            color: #64748b;
            font-weight: bold;
            line-height: 1.4;
        }

        /* 하단 조작 버튼 영역 */
        .nav-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            padding: 20px 14px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-prev {
            background-color: #e2e8f0;
            color: #475569;
            flex: 0 0 140px;
        }

        .btn-prev:hover {
            background-color: #cbd5e1;
        }

        .btn-next {
            background-color: #1D9E75;
            color: #ffffff;
        }

        .btn-next:hover {
            background-color: #157958;
        }

        /* 분기 선택 버튼 */
        .btn-choice-kakao {
            background-color: #fee500;
            color: #191919;
        }
        .btn-choice-kakao:hover {
            background-color: #fada0a;
        }

        .btn-choice-nhis {
            background-color: #E65100;
            color: #ffffff;
        }
        .btn-choice-nhis:hover {
            background-color: #c74300;
        }

        .btn-choice-fax {
            background-color: #2563eb;
            color: #ffffff;
        }
        .btn-choice-fax:hover {
            background-color: #1d4ed8;
        }

        .btn-choice-cert {
            background-color: #4f46e5;
            color: #ffffff;
        }
        .btn-choice-cert:hover {
            background-color: #4338ca;
        }

        .btn-choice-pdf {
            background-color: #0d9488;
            color: #ffffff;
        }
        .btn-choice-pdf:hover {
            background-color: #0f766e;
        }

        /* [우측 창] 스마트폰 이미지 영역 */
        .phone-panel {
            width: 62%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #eaedf2; 
            padding: 20px;
            transition: opacity 0.3s ease;
        }

        .phone-panel.hidden {
            display: none;
        }

        .phone-frame {
            width: 100%; 
            height: 100%; 
            background-color: transparent; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            background-color: transparent; 
            overflow: hidden;
            position: relative;
        }

        .raw-guide-image {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.15s ease-in-out;
            pointer-events: none;
        }

        .raw-guide-image.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 3개 이미지 나열 컨테이너 */
        .triple-image-container {
            display: none;
            width: 100%;
            height: 100%;
            gap: 15px;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
        }

        .triple-image-container.active {
            display: flex;
        }

        .triple-image-item {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .triple-image-item img {
            width: 100%;
            height: calc(100% - 40px);
            object-fit: contain;
        }

        .triple-image-label {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 800;
            color: #005088;
        }

        /* 관리자 통계 팝업 모달 */
        .admin-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.6);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }
        .admin-content {
            background: white;
            padding: 30px;
            border-radius: 16px;
            width: 530px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .admin-content h2 {
            color: #005088;
            margin-bottom: 15px;
            border-bottom: 2px solid #1D9E75;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .section-title {
            font-size: 15px;
            font-weight: bold;
            color: #475569;
            margin: 12px 0 6px 0;
            background-color: #f1f5f9;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .stat-item {
            font-size: 16px;
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stat-item b {
            color: #E65100;
        }
        .diff-tag {
            font-size: 13px;
            font-weight: bold;
            margin-left: 6px;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .diff-up {
            color: #dc2626;
            background-color: #fee2e2;
        }
        .diff-down {
            color: #2563eb;
            background-color: #dbeafe;
        }
        .diff-same {
            color: #64748b;
            background-color: #f1f5f9;
        }
        .admin-btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-admin-action {
            flex: 1;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-archive {
            background-color: #f59e0b;
            color: white;
        }
        .btn-archive:hover {
            background-color: #d97706;
        }
        .btn-reset {
            background-color: #ef4444;
            color: white;
        }
        .btn-reset:hover {
            background-color: #dc2626;
        }
        .btn-close-modal {
            margin-top: 10px;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background-color: #005088;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="guide-panel" id="guidePanel">
        <!-- 5회 연속 클릭 시 관리자 통계 모달 오픈 -->
        <div class="header" onclick="handleAdminTrigger()">
            <h1>국민건강보험 서류발급 비서 '든든이'</h1>
        </div>

        <div class="step-info" id="stepInfoContainer">
            <div class="step-number" id="stepNum">단계 1</div>
            <div class="step-instruction" id="stepText">가이드를 불러오는 중입니다...</div>
            <div id="homeGridContainer"></div>
        </div>

        <div class="nav-buttons" id="buttonContainer">
            <!-- JS 동적 생성 -->
        </div>
    </div>

    <div class="phone-panel" id="phonePanel">
        <div class="phone-frame">
            <div class="phone-screen" id="imageContainer">
                <img src="0.png" alt="0" class="raw-guide-image" id="img-common-1">
                <img src="1.png" alt="1" class="raw-guide-image" id="img-common-2">
                <img src="2.png" alt="2" class="raw-guide-image" id="img-common-3">
                <img src="3.png" alt="3" class="raw-guide-image" id="img-common-4">

                <img src="7-0.png" alt="7-0" class="raw-guide-image" id="img-wn-init-3">
                <img src="7-0-1.png" alt="7-0-1" class="raw-guide-image" id="img-wn-init-4">

                <img src="5-1.png" alt="5-1" class="raw-guide-image" id="img-kakao-1">
                <img src="5-2.png" alt="5-2" class="raw-guide-image" id="img-kakao-2">
                <img src="5-3.png" alt="5-3" class="raw-guide-image" id="img-kakao-3">
                <img src="5-4.png" alt="5-4" class="raw-guide-image" id="img-kakao-4">
                <img src="5-5.png" alt="5-5" class="raw-guide-image" id="img-kakao-5">
                <img src="5-6.png" alt="5-6" class="raw-guide-image" id="img-kakao-6">

                <img src="4-1.png" alt="4-1" class="raw-guide-image" id="img-nhis-1">
                <img src="4-2.png" alt="4-2" class="raw-guide-image" id="img-nhis-2">
                <img src="4-3.png" alt="4-3" class="raw-guide-image" id="img-nhis-3">
                <img src="4-4.png" alt="4-4" class="raw-guide-image" id="img-nhis-4">
                <img src="4-5.png" alt="4-5" class="raw-guide-image" id="img-nhis-5">
                <img src="4-6.png" alt="4-6" class="raw-guide-image" id="img-nhis-6">
                <img src="4-7.png" alt="4-7" class="raw-guide-image" id="img-nhis-7">
                <img src="4-8.png" alt="4-8" class="raw-guide-image" id="img-nhis-8">
                <img src="4-9.png" alt="4-9" class="raw-guide-image" id="img-nhis-9">
                <img src="4-10.png" alt="4-10" class="raw-guide-image" id="img-nhis-10">

                <div class="triple-image-container" id="tripleContainer">
                    <div class="triple-image-item">
                        <img src="4-11.png" alt="4-11">
                        <div class="triple-image-label">① 로그인 선택</div>
                    </div>
                    <div class="triple-image-item">
                        <img src="4-12.png" alt="4-12">
                        <div class="triple-image-label">② 입력란 선택</div>
                    </div>
                    <div class="triple-image-item">
                        <img src="4-13.png" alt="4-13">
                        <div class="triple-image-label">③ 비밀번호 입력</div>
                    </div>
                </div>

                <img src="6.png" alt="6" class="raw-guide-image" id="img-step-6">
                <img src="6-1.png" alt="6-1" class="raw-guide-image" id="img-fax-1">
                <img src="6-2.png" alt="6-2" class="raw-guide-image" id="img-cert-1">
                <img src="6-2-1.png" alt="6-2-1" class="raw-guide-image" id="img-cert-2">
                <img src="6-3.png" alt="6-3" class="raw-guide-image" id="img-pdf-1">
                <img src="6-3-1.png" alt="6-3-1" class="raw-guide-image" id="img-pdf-2">
                <img src="6-3-2.png" alt="6-3-2" class="raw-guide-image" id="img-pdf-3">
                <img src="6-3-3.png" alt="6-3-3" class="raw-guide-image" id="img-pdf-4">
                <img src="6-3-4.png" alt="6-3-4" class="raw-guide-image" id="img-pdf-5">
                <img src="6-3-5.png" alt="6-3-5" class="raw-guide-image" id="img-pdf-6">

                <img src="7.png" alt="7" class="raw-guide-image" id="img-wn-main">
                <img src="7-1-1.png" alt="7-1-1" class="raw-guide-image" id="img-wn-print-1">
                <img src="7-1-2.png" alt="7-1-2" class="raw-guide-image" id="img-wn-print-2">

            </div>
        </div>
    </div>

    <!-- 관리자 성과 비교 모달 -->
    <div class="admin-modal" id="adminModal">
        <div class="admin-content">
            <h2>
                <span>📊 발급 성과 관리</span>
                <span style="font-size: 13px; font-weight: normal; color: #64748b;">전일 대비 비교</span>
            </h2>

            <div class="section-title">📌 전체 발급 실적</div>
            <div class="stat-item">
                <span>총 발급 시도:</span>
                <div>
                    <b id="statAttempt">0</b>건
                    <span id="diffAttempt" class="diff-tag"></span>
                </div>
            </div>
            <div class="stat-item">
                <span>총 발급 완료:</span>
                <div>
                    <b id="statComplete">0</b>건
                    <span id="diffComplete" class="diff-tag"></span>
                </div>
            </div>
            <div class="stat-item">
                <span>비대면 성공률:</span>
                <div>
                    <b id="statRate">0%</b>
                    <span id="diffRate" class="diff-tag"></span>
                </div>
            </div>

            <div class="section-title">🔑 로그인 인증 방식별 현황</div>
            <div class="stat-item">
                <span>- 간편인증(카카오 등):</span>
                <div>
                    <b id="statKakao">0</b>건 (<span id="rateKakao">0%</span>)
                    <span id="diffKakao" class="diff-tag"></span>
                </div>
            </div>
            <div class="stat-item">
                <span>- 건강보험 인증서:</span>
                <div>
                    <b id="statNhis">0</b>건 (<span id="rateNhis">0%</span>)
                    <span id="diffNhis" class="diff-tag"></span>
                </div>
            </div>

            <div class="section-title">📄 서류 종류별 완료 현황</div>
            <div class="stat-item">
                <span>- 납부확인서 완료:</span>
                <div>
                    <b id="statPay">0</b>건
                    <span id="diffPay" class="diff-tag"></span>
                </div>
            </div>
            <div class="stat-item">
                <span>- 완납증명서 완료:</span>
                <div>
                    <b id="statWn">0</b>건
                    <span id="diffWn" class="diff-tag"></span>
                </div>
            </div>
            
            <div class="stat-item" style="font-size: 14px; color: #64748b; margin-top: 10px;">
                * 오늘 단축된 대기시간: <b id="statTimeSaved" style="color: #1D9E75;">0</b>분
            </div>

            <div class="admin-btn-group">
                <button class="btn-admin-action btn-archive" onclick="archiveTodayStats()">오늘 마감(어제로 이관)</button>
                <button class="btn-admin-action btn-reset" onclick="resetAllStats()">전체 초기화</button>
            </div>
            <button class="btn-close-modal" onclick="closeAdminModal()">창 닫기</button>
        </div>
    </div>

    <script>
        // ★ 구글 Apps Script 웹 앱 URL 입력란
        const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbyzqp8pBGs-jlXQbFUuFSNeI9lmpHfBGpJjjEUPkJdsxlvUnBfkyAHNlVhAsjNkAgaF/exec";

        function recordLog(action, docType, issueMethod) {
            const authText = (loginMethod === 'kakao') ? '카카오간편인증' : ((loginMethod === 'nhis') ? '건강보험인증서' : '미선택');
            const docText = (docType === 'pay') ? '보험료 납부확인서' : '4대보험 완납증명서';

            if (action === '시도') {
                let attempts = parseInt(localStorage.getItem('stat_attempts') || '0') + 1;
                localStorage.setItem('stat_attempts', attempts);
            } else if (action === '완료') {
                let completes = parseInt(localStorage.getItem('stat_completes') || '0') + 1;
                localStorage.setItem('stat_completes', completes);
                if (docType === 'pay') {
                    let payCnt = parseInt(localStorage.getItem('stat_pay') || '0') + 1;
                    localStorage.setItem('stat_pay', payCnt);
                } else {
                    let wnCnt = parseInt(localStorage.getItem('stat_wn') || '0') + 1;
                    localStorage.setItem('stat_wn', wnCnt);
                }
            }

            if (GOOGLE_SHEET_URL && GOOGLE_SHEET_URL !== "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL") {
                const payload = {
                    action: action,
                    document: docText,
                    authMethod: authText,
                    issueMethod: issueMethod
                };

                fetch(GOOGLE_SHEET_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).catch(err => console.log('Log completed'));
            }
        }

        let selectedDoc = 'pay'; 
        let stage = 'home'; 
        let currentSubStep = 1;
        let loginMethod = 'none'; 

        function getCommonStepText(subStep) {
            if (subStep === 1) {
                return `안녕하세요, 고객님!\n창구 대기 고객이 많아 오래 기다리셔야 합니다.\n\n대기 없이 <span class="orange">3분 만에 스마트폰으로 서류 발급 가능</span>합니다!\n\n<span class="orange">[건강보험 25시]</span> 어플이 있으신가요?\n없으시다면, 우측의 <span class="orange">QR코드</span>를 통해 설치해주세요!`;
            } else if (subStep === 2) {
                return `스마트폰 바탕화면에서 <span class="orange">[건강보험 25시]</span> 어플을 눌러주세요!`;
            } else if (subStep === 3) {
                if (selectedDoc === 'pay') {
                    return `주황색으로 강조 표시된 <span class="orange">[바로가기]</span>를 선택해주세요.`;
                } else {
                    return `상단 검색창에 주황색 글씨로 안내된 <span class="orange">"완납증명서"</span>를 입력해주세요!`;
                }
            } else if (subStep === 4) {
                if (selectedDoc === 'pay') {
                    return `주황색으로 강조 표시된 <span class="orange">[보험료 납부확인서 발급]</span>을 선택해주세요.`;
                } else {
                    return `모바일 메뉴 검색 결과에서\n주황색 상자로 강조된 <span class="orange">[증명서 > 건강보험 > 4대 사회보험료 완납증명서]</span>를 선택해주세요!`;
                }

                phonePanel.classList.remove("hidden");

                document.getElementById("stepNum").innerText = "완납증명서 팩스 전송";
                document.getElementById("stepText").innerHTML = wnFaxSteps[0];

                const curImg = document.getElementById("img-wn-fax");
                if (curImg) curImg.classList.add('active');

                recordLog('완료', 'complete', '팩스전송');

                buttonContainer.innerHTML = `
                    <button class="btn btn-prev" onclick="prevStep()">이전으로</button>
                    <button class="btn btn-next" onclick="resetToStart()">처음 화면으로</button>
                `;
            }
        }

        function startWorkflow(docType) {
            selectedDoc = docType;
            loginMethod = 'none';
            stage = 'common';
            currentSubStep = 1;

            recordLog('시도', docType, '-');

            refreshDisplay();
        }

        // 로그인 분기 선택 및 로깅
        function selectLoginPath(chosenPath) {
            loginMethod = chosenPath;

            // 로컬스토리지에 인증방식 카운트 기록
            if (chosenPath === 'kakao') {
                let kCnt = parseInt(localStorage.getItem('stat_auth_kakao') || '0') + 1;
                localStorage.setItem('stat_auth_kakao', kCnt);
            } else if (chosenPath === 'nhis') {
                let nCnt = parseInt(localStorage.getItem('stat_auth_nhis') || '0') + 1;
                localStorage.setItem('stat_auth_nhis', nCnt);
            }

            stage = chosenPath;
            currentSubStep = 1;
            refreshDisplay();
        }

        function selectPayIssuePath(chosenIssue) {
            stage = chosenIssue;
            currentSubStep = 1;
            refreshDisplay();
        }

        function selectWnIssuePath(chosenIssue) {
            if (chosenIssue === 'print') {
                stage = 'wn-print';
            } else {
                stage = 'wn-fax';
            }
            currentSubStep = 1;
            refreshDisplay();
        }

        function nextStep() {
            if (stage === 'common') {
                if (currentSubStep < 4) {
                    currentSubStep++;
                } else {
                    stage = 'choice';
                }
            } else if (stage === 'kakao') {
                if (currentSubStep < kakaoSteps.length) {
                    currentSubStep++;
                } else {
                    stage = (selectedDoc === 'pay') ? 'pay-6' : 'wn-main';
                }
            } else if (stage === 'nhis') {
                if (currentSubStep < nhisSteps.length) {
                    currentSubStep++;
                } else {
                    stage = (selectedDoc === 'pay') ? 'pay-6' : 'wn-main';
                }
            } else if (stage === 'cert') {
                if (currentSubStep < certSteps.length) {
                    currentSubStep++;
                }
            } else if (stage === 'pdf') {
                if (currentSubStep < pdfSteps.length) {
                    currentSubStep++;
                }
            } else if (stage === 'wn-print') {
                if (currentSubStep < wnPrintSteps.length) {
                    currentSubStep++;
                }
            }
            refreshDisplay();
        }

        function prevStep() {
            if (stage === 'common') {
                if (currentSubStep > 1) {
                    currentSubStep--;
                } else {
                    stage = 'home';
                }
            } else if (stage === 'choice') {
                stage = 'common';
                currentSubStep = 4;
            } else if (stage === 'kakao' || stage === 'nhis') {
                if (currentSubStep > 1) {
                    currentSubStep--;
                } else {
                    stage = 'choice';
                }
            } else if (stage === 'pay-6' || stage === 'wn-main') {
                if (loginMethod === 'kakao') {
                    stage = 'kakao';
                    currentSubStep = kakaoSteps.length;
                } else {
                    stage = 'nhis';
                    currentSubStep = nhisSteps.length;
                }
            } else if (stage === 'fax') {
                stage = 'pay-6';
            } else if (stage === 'cert') {
                if (currentSubStep > 1) {
                    currentSubStep--;
                } else {
                    stage = 'pay-6';
                }
            } else if (stage === 'pdf') {
                if (currentSubStep > 1) {
                    currentSubStep--;
                } else {
                    stage = 'pay-6';
                }
            } else if (stage === 'wn-print') {
                if (currentSubStep > 1) {
                    currentSubStep--;
                } else {
                    stage = 'wn-main';
                }
            } else if (stage === 'wn-fax') {
                stage = 'wn-main';
            }
            refreshDisplay();
        }

        function resetToStart() {
            stage = 'home';
            currentSubStep = 1;
            refreshDisplay();
        }

        // 5회 터치 시 관리자 모달 트리거
        let adminClickCount = 0;
        let adminClickTimer = null;
        function handleAdminTrigger() {
            adminClickCount++;
            clearTimeout(adminClickTimer);
            adminClickTimer = setTimeout(() => {
                adminClickCount = 0;
            }, 2000);

            if (adminClickCount >= 5) {
                adminClickCount = 0;
                openAdminModal();
            }
        }

        // 전일 대비 증감 태그 렌더링 헬퍼 함수
        function renderDiffTag(elementId, currentVal, prevVal, isRate = false) {
            const el = document.getElementById(elementId);
            const diff = currentVal - prevVal;
            if (prevVal === 0 && currentVal === 0) {
                el.innerText = '-';
                el.className = 'diff-tag diff-same';
                return;
            }

            if (diff > 0) {
                el.innerText = `+${isRate ? diff.toFixed(1) : diff}${isRate ? '%p' : ''} 🔺`;
                el.className = 'diff-tag diff-up';
            } else if (diff < 0) {
                el.innerText = `${isRate ? diff.toFixed(1) : diff}${isRate ? '%p' : ''} 🔻`;
                el.className = 'diff-tag diff-down';
            } else {
                el.innerText = `변동 없음`;
                el.className = 'diff-tag diff-same';
            }
        }

        function openAdminModal() {
            // 오늘 데이터
            const attempts = parseInt(localStorage.getItem('stat_attempts') || '0');
            const completes = parseInt(localStorage.getItem('stat_completes') || '0');
            const kakaoCnt = parseInt(localStorage.getItem('stat_auth_kakao') || '0');
            const nhisCnt = parseInt(localStorage.getItem('stat_auth_nhis') || '0');
            const payCnt = parseInt(localStorage.getItem('stat_pay') || '0');
            const wnCnt = parseInt(localStorage.getItem('stat_wn') || '0');

            const totalAuth = kakaoCnt + nhisCnt;
            const rateKakao = totalAuth > 0 ? ((kakaoCnt / totalAuth) * 100).toFixed(1) : 0;
            const rateNhis = totalAuth > 0 ? ((nhisCnt / totalAuth) * 100).toFixed(1) : 0;

            const rate = attempts > 0 ? parseFloat(((completes / attempts) * 100).toFixed(1)) : 0;
            const timeSaved = completes * 15;

            // 어제 데이터
            const prevAttempts = parseInt(localStorage.getItem('prev_stat_attempts') || '0');
            const prevCompletes = parseInt(localStorage.getItem('prev_stat_completes') || '0');
            const prevKakaoCnt = parseInt(localStorage.getItem('prev_stat_auth_kakao') || '0');
            const prevNhisCnt = parseInt(localStorage.getItem('prev_stat_auth_nhis') || '0');
            const prevPayCnt = parseInt(localStorage.getItem('prev_stat_pay') || '0');
            const prevWnCnt = parseInt(localStorage.getItem('prev_stat_wn') || '0');
            const prevRate = prevAttempts > 0 ? parseFloat(((prevCompletes / prevAttempts) * 100).toFixed(1)) : 0;

            // 값 바인딩
            document.getElementById('statAttempt').innerText = attempts;
            document.getElementById('statComplete').innerText = completes;
            document.getElementById('statRate').innerText = `${rate}%`;
            document.getElementById('statKakao').innerText = kakaoCnt;
            document.getElementById('rateKakao').innerText = `${rateKakao}%`;
            document.getElementById('statNhis').innerText = nhisCnt;
            document.getElementById('rateNhis').innerText = `${rateNhis}%`;
            document.getElementById('statPay').innerText = payCnt;
            document.getElementById('statWn').innerText = wnCnt;
            document.getElementById('statTimeSaved').innerText = timeSaved;

            // 전일 대비 증감 렌더링
            renderDiffTag('diffAttempt', attempts, prevAttempts);
            renderDiffTag('diffComplete', completes, prevCompletes);
            renderDiffTag('diffRate', rate, prevRate, true);
            renderDiffTag('diffKakao', kakaoCnt, prevKakaoCnt);
            renderDiffTag('diffNhis', nhisCnt, prevNhisCnt);
            renderDiffTag('diffPay', payCnt, prevPayCnt);
            renderDiffTag('diffWn', wnCnt, prevWnCnt);

            document.getElementById('adminModal').style.display = 'flex';
        }

        function closeAdminModal() {
            document.getElementById('adminModal').style.display = 'none';
        }

        // 오늘 마감 및 어제로 이관
        function archiveTodayStats() {
            if (confirm("오늘 실적을 '어제 데이터'로 이관하고, 오늘 수치를 0으로 초기화하시겠습니까?\n(내일 실적과 비교 기준으로 사용됩니다.)")) {
                localStorage.setItem('prev_stat_attempts', localStorage.getItem('stat_attempts') || '0');
                localStorage.setItem('prev_stat_completes', localStorage.getItem('stat_completes') || '0');
                localStorage.setItem('prev_stat_auth_kakao', localStorage.getItem('stat_auth_kakao') || '0');
                localStorage.setItem('prev_stat_auth_nhis', localStorage.getItem('stat_auth_nhis') || '0');
                localStorage.setItem('prev_stat_pay', localStorage.getItem('stat_pay') || '0');
                localStorage.setItem('prev_stat_wn', localStorage.getItem('stat_wn') || '0');

                localStorage.setItem('stat_attempts', '0');
                localStorage.setItem('stat_completes', '0');
                localStorage.setItem('stat_auth_kakao', '0');
                localStorage.setItem('stat_auth_nhis', '0');
                localStorage.setItem('stat_pay', '0');
                localStorage.setItem('stat_wn', '0');

                alert("오늘 실적이 마감되었습니다. 수치가 새롭게 시작됩니다.");
                openAdminModal();
            }
        }

        // 전체 초기화
        function resetAllStats() {
            if (confirm("어제 및 오늘의 모든 통계 데이터를 완전히 삭제하시겠습니까?")) {
                const keys = [
                    'stat_attempts', 'stat_completes', 'stat_auth_kakao', 'stat_auth_nhis', 'stat_pay', 'stat_wn',
                    'prev_stat_attempts', 'prev_stat_completes', 'prev_stat_auth_kakao', 'prev_stat_auth_nhis', 'prev_stat_pay', 'prev_stat_wn'
                ];
                keys.forEach(k => localStorage.removeItem(k));
                alert("모든 통계가 초기화되었습니다.");
                openAdminModal();
            }
        }

        window.onload = function() {
            refreshDisplay();
        };
    </script>
