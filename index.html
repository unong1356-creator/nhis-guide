<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서류발급 비서 - 든든이</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #f4f6f9;
            overflow: hidden;
        }

        /* [좌측 창] 대형 안내 및 컨트롤 영역 */
        .guide-panel {
            width: 38%;
            background-color: #ffffff;
            border-right: 2px solid #e2e8f0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 5px 0 15px rgba(0,0,0,0.05);
            z-index: 10;
            transition: width 0.3s ease;
        }

        .guide-panel.full-width {
            width: 100%;
            border-right: none;
        }

        .header {
            border-bottom: 4px solid #1D9E75;
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 28px;
            color: #005088;
            line-height: 1.3;
        }

        .step-info {
            flex-grow: 1;
            margin-top: 30px;
        }

        .step-number {
            font-size: 24px;
            font-weight: bold;
            color: #1D9E75;
            margin-bottom: 15px;
        }

        .step-instruction {
            font-size: 25px;
            font-weight: 800;
            color: #1e293b;
            line-height: 1.6;
            word-break: keep-all;
            white-space: pre-wrap;
        }

        .orange {
            color: #E65100;
            font-weight: 900;
        }

        /* 홈 대형 서류 선택 카드 */
        .home-menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-top: 40px;
            margin-bottom: 30px;
        }

        .menu-card {
            background-color: #f8fafc;
            border: 3px solid #cbd5e1;
            border-radius: 20px;
            padding: 40px 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.04);
        }

        .menu-card:hover {
            border-color: #1D9E75;
            background-color: #f0fdf4;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(29, 158, 117, 0.15);
        }

        .menu-card .card-icon {
            font-size: 55px;
            margin-bottom: 20px;
        }

        .menu-card .card-title {
            font-size: 28px;
            font-weight: 900;
            color: #005088;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .menu-card .card-desc {
            font-size: 19px;
            color: #64748b;
            font-weight: bold;
            line-height: 1.4;
        }

        /* 하단 조작 버튼 영역 */
        .nav-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            padding: 20px 14px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-prev {
            background-color: #e2e8f0;
            color: #475569;
            flex: 0 0 140px;
        }

        .btn-prev:hover {
            background-color: #cbd5e1;
        }

        .btn-next {
            background-color: #1D9E75;
            color: #ffffff;
        }

        .btn-next:hover {
            background-color: #157958;
        }

        /* 로그인 분기 선택 버튼 */
        .btn-choice-kakao {
            background-color: #fee500;
            color: #191919;
        }
        .btn-choice-kakao:hover {
            background-color: #fada0a;
        }

        .btn-choice-nhis {
            background-color: #E65100;
            color: #ffffff;
        }
        .btn-choice-nhis:hover {
            background-color: #c74300;
        }

        /* 발급 방식 버튼 */
        .btn-choice-fax {
            background-color: #2563eb;
            color: #ffffff;
        }
        .btn-choice-fax:hover {
            background-color: #1d4ed8;
        }

        .btn-choice-cert {
            background-color: #4f46e5;
            color: #ffffff;
        }
        .btn-choice-cert:hover {
            background-color: #4338ca;
        }

        .btn-choice-pdf {
            background-color: #0d9488;
            color: #ffffff;
        }
        .btn-choice-pdf:hover {
            background-color: #0f766e;
        }

        /* [우측 창] 스마트폰 이미지 영역 */
        .phone-panel {
            width: 62%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #eaedf2; 
            padding: 20px;
            transition: opacity 0.3s ease;
        }

        .phone-panel.hidden {
            display: none;
        }

        .phone-frame {
            width: 100%; 
            height: 100%; 
            background-color: transparent; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            background-color: transparent; 
            overflow: hidden;
            position: relative;
        }

        .raw-guide-image {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.15s ease-in-out;
            pointer-events: none;
        }

        .raw-guide-image.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 3개 이미지 가로 나열 컨테이너 */
        .triple-image-container {
            display: none;
            width: 100%;
            height: 100%;
            gap: 15px;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
        }

        .triple-image-container.active {
            display: flex;
        }

        .triple-image-item {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .triple-image-item img {
            width: 100%;
            height: calc(100% - 40px);
            object-fit: contain;
        }

        .triple-image-label {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 800;
            color: #005088;
        }
    </style>
</head>
<body>

    <div class="guide-panel" id="guidePanel">
        <div class="header">
            <h1>국민건강보험 서류발급 비서 '든든이'</h1>
        </div>

        <div class="step-info" id="stepInfoContainer">
            <div class="step-number" id="stepNum">단계 1</div>
            <div class="step-instruction" id="stepText">가이드를 불러오는 중입니다...</div>
            <div id="homeGridContainer"></div>
        </div>

        <div class="nav-buttons" id="buttonContainer">
            <!-- JS 동적 생성 -->
        </div>
    </div>

    <div class="phone-panel" id="phonePanel">
        <div class="phone-frame">
            <div class="phone-screen" id="imageContainer">
                <!-- 공통 단계 (납부확인서: 0, 1, 2, 3) -->
                <img src="0.png" alt="0" class="raw-guide-image" id="img-common-1">
                <img src="1.png" alt="1" class="raw-guide-image" id="img-common-2">
                <img src="2.png" alt="2" class="raw-guide-image" id="img-common-3">
                <img src="3.png" alt="3" class="raw-guide-image" id="img-common-4">

                <!-- 완납증명서 전용 초기 단계 (7-0.png, 7-0-1.png) -->
                <img src="7-0.png" alt="7-0" class="raw-guide-image" id="img-wn-init-3">
                <img src="7-0-1.png" alt="7-0-1" class="raw-guide-image" id="img-wn-init-4">

                <!-- 분기 A: 카카오 간편인증 (5-1~5-6) -->
                <img src="5-1.png" alt="5-1" class="raw-guide-image" id="img-kakao-1">
                <img src="5-2.png" alt="5-2" class="raw-guide-image" id="img-kakao-2">
                <img src="5-3.png" alt="5-3" class="raw-guide-image" id="img-kakao-3">
                <img src="5-4.png" alt="5-4" class="raw-guide-image" id="img-kakao-4">
                <img src="5-5.png" alt="5-5" class="raw-guide-image" id="img-kakao-5">
                <img src="5-6.png" alt="5-6" class="raw-guide-image" id="img-kakao-6">

                <!-- 분기 B: 건강보험 인증서 (4-1~4-10) -->
                <img src="4-1.png" alt="4-1" class="raw-guide-image" id="img-nhis-1">
                <img src="4-2.png" alt="4-2" class="raw-guide-image" id="img-nhis-2">
                <img src="4-3.png" alt="4-3" class="raw-guide-image" id="img-nhis-3">
                <img src="4-4.png" alt="4-4" class="raw-guide-image" id="img-nhis-4">
                <img src="4-5.png" alt="4-5" class="raw-guide-image" id="img-nhis-5">
                <img src="4-6.png" alt="4-6" class="raw-guide-image" id="img-nhis-6">
                <img src="4-7.png" alt="4-7" class="raw-guide-image" id="img-nhis-7">
                <img src="4-8.png" alt="4-8" class="raw-guide-image" id="img-nhis-8">
                <img src="4-9.png" alt="4-9" class="raw-guide-image" id="img-nhis-9">
                <img src="4-10.png" alt="4-10" class="raw-guide-image" id="img-nhis-10">

                <!-- 건강보험 인증서 11단계 (4-11 ~ 4-13 3분할) -->
                <div class="triple-image-container" id="tripleContainer">
                    <div class="triple-image-item">
                        <img src="4-11.png" alt="4-11">
                        <div class="triple-image-label">① 로그인 선택</div>
                    </div>
                    <div class="triple-image-item">
                        <img src="4-12.png" alt="4-12">
                        <div class="triple-image-label">② 입력란 선택</div>
                    </div>
                    <div class="triple-image-item">
                        <img src="4-13.png" alt="4-13">
                        <div class="triple-image-label">③ 비밀번호 입력</div>
                    </div>
                </div>

                <!-- [납부확인서] 6단계 메인 및 분기 이미지 -->
                <img src="6.png" alt="6" class="raw-guide-image" id="img-step-6">
                <img src="6-1.png" alt="6-1" class="raw-guide-image" id="img-fax-1">
                <img src="6-2.png" alt="6-2" class="raw-guide-image" id="img-cert-1">
                <img src="6-2-1.png" alt="6-2-1" class="raw-guide-image" id="img-cert-2">
                <img src="6-3.png" alt="6-3" class="raw-guide-image" id="img-pdf-1">
                <img src="6-3-1.png" alt="6-3-1" class="raw-guide-image" id="img-pdf-2">
                <img src="6-3-2.png" alt="6-3-2" class="raw-guide-image" id="img-pdf-3">
                <img src="6-3-3.png" alt="6-3-3" class="raw-guide-image" id="img-pdf-4">
                <img src="6-3-4.png" alt="6-3-4" class="raw-guide-image" id="img-pdf-5">
                <img src="6-3-5.png" alt="6-3-5" class="raw-guide-image" id="img-pdf-6">

                <!-- [완납증명서] 7단계 메인 및 분기 이미지 -->
                <img src="7.png" alt="7" class="raw-guide-image" id="img-wn-main">
                <img src="7-1-1.png" alt="7-1-1" class="raw-guide-image" id="img-wn-print-1">
                <img src="7-1-2.png" alt="7-1-2" class="raw-guide-image" id="img-wn-print-2">
                <img src="7-2.png" alt="7-2" class="raw-guide-image" id="img-wn-fax">
            </div>
        </div>
    </div>

    <script>
        let selectedDoc = 'pay'; // 'pay' | 'complete'
        let stage = 'home'; 
        let currentSubStep = 1;
        let loginMethod = 'kakao'; 

        // 1. 공통 및 초기 단계 안내 문구
        function getCommonStepText(subStep) {
            if (subStep === 1) {
                return `안녕하세요, 고객님!\n창구 대기 고객이 많아 오래 기다리셔야 합니다.\n\n대기 없이 <span class="orange">3분 만에 스마트폰으로 서류 발급 가능</span>합니다!\n\n<span class="orange">[건강보험 25시]</span> 어플이 있으신가요?\n없으시다면, 우측의 <span class="orange">QR코드</span>를 통해 설치해주세요!`;
            } else if (subStep === 2) {
                return `스마트폰 바탕화면에서 <span class="orange">[건강보험 25시]</span> 어플을 눌러주세요!`;
            } else if (subStep === 3) {
                if (selectedDoc === 'pay') {
                    return `주황색으로 강조 표시된 <span class="orange">[바로가기]</span>를 선택해주세요.`;
                } else {
                    return `상단 검색창에 주황색 글씨로 안내된 <span class="orange">"완납증명서"</span>를 입력해주세요!`;
                }
            } else if (subStep === 4) {
                if (selectedDoc === 'pay') {
                    return `주황색으로 강조 표시된 <span class="orange">[보험료 납부확인서 발급]</span>을 선택해주세요.`;
                } else {
                    return `모바일 메뉴 검색 결과에서\n주황색 상자로 강조된 <span class="orange">[증명서 > 건강보험 > 4대 사회보험료 완납증명서]</span>를 선택해주세요!`;
                }
            }
        }

        // 2. 로그인 선택 문구
        const choiceStepText = `카카오톡 또는 네이버 인증서 발급이 되어있으신가요?\n\n[카카오톡 또는 네이버 인증서]가 있다면 -> <span class="orange">간편인증 로그인</span>\n없으시다면 -> <span class="orange">건강보험 인증서 발급 로그인</span>\n\n건강보험 인증서 발급 시 [건강보험 25시] 어플 사용 시 자동로그인 되어 편리합니다!\n\n선택해주세요!`;

        // 3. 카카오 간편인증 문구
        const kakaoSteps = [
            `주황색으로 강조 표시된 <span class="orange">[로그인]</span>을 선택해주세요.`,
            `주황색으로 강조 표시된 <span class="orange">[카카오톡]</span>을 선택해주세요.`,
            `① <span class="orange">이름</span>\n② <span class="orange">생년월일 8자리</span>\n③ <span class="orange">휴대폰 번호 8자리</span>를 입력한 후\n④ <span class="orange">[다음]</span>을 선택해주세요.`,
            `하단의 주황색으로 강조 표시된 <span class="orange">[모두 동의하고 인증요청]</span>을 선택해주세요.`,
            `카카오톡 화면에서 ① <span class="orange">[필수 제공 동의]</span> 체크 후\n② 노란색 <span class="orange">[인증하기]</span> 버튼을 눌러주세요.`,
            `카카오톡 인증 완료 후 어플로 돌아와 하단의 주황색 <span class="orange">[인증 완료]</span>를 눌러주세요!`
        ];

        // 4. 건강보험 인증서 문구
        const nhisSteps = [
            `주황색으로 강조 표시된 <span class="orange">[다른 로그인 방법 선택]</span>을 선택해주세요.`,
            `주황색으로 강조 표시된 <span class="orange">[건강보험 인증서]</span>를 선택해주세요.`,
            `아래로 스크롤 하여 <span class="orange">[전체 동의]</span> 선택 후 <span class="orange">[휴대폰 본인인증(PASS)]</span>를 선택해주세요.`,
            `주황색으로 강조 표시된 <span class="orange">[휴대폰 본인인증(PASS)]</span>를 선택해주세요.`,
            `이용중인 <span class="orange">통신사</span>를 선택해 주세요!`,
            `① 주황색으로 강조 표시된 <span class="orange">[문자 인증]</span>을 선택해주세요.\n② 주황색으로 강조된 <span class="orange">[본인확인 동의]</span> 동그라미를 선택해주세요.\n③ <span class="orange">다음</span>을 선택해주세요.\n\nPASS앱 이용 중이시라면 PASS로 인증하셔도 됩니다!`,
            `<span class="orange">이름</span>과, <span class="orange">생년월일 앞 7자리</span>, <span class="orange">휴대폰번호</span>와 <span class="orange">보안문자</span>를 입력한 후 <span class="orange">다음</span>을 선택해주세요.`,
            `문자로 전송 받은 <span class="orange">인증번호</span>를 입력한 후 <span class="orange">확인</span>을 선택해주세요.`,
            `앞으로 건강보험25시 어플 사용 시 자동로그인을 위한\n\n기억하기 쉬운 비밀번호를 2번 입력한 후 <span class="orange">[등록]</span>을 눌러주세요.`,
            `건강보험 인증서가 발급되었어요! 대단해요 :)\n\n<span class="orange">[확인]</span>을 눌러주세요. 이제 제증명 발급이 가능해졌어요!`,
            `<span class="orange">[로그인]</span>을 눌러주시고, 설정한 <span class="orange">비밀번호 6자리</span>를 입력해주세요!`
        ];

        // 5. [납부확인서] 안내 문구
        const payStep6MainText = `주황색으로 강조 표시된 <span class="orange">①, ②, ③번</span>을 설정한 뒤 <span class="orange">④번 [조 회]</span>를 눌러주세요!\n\n조회 결과에서 <span class="orange">⑤번 목록 체크</span> 후,\n★ 실물 종이 출력을 원하시면 하단 파란색 <span class="orange">[전자증명서(다운로드)]</span>를 눌러주셔야 합니다!\n\n원하시는 발급 방식을 아래 버튼에서 선택해 주세요!`;
        const faxSteps = [`①, ②번 순서에 따라\n<span class="orange">팩스전송번호 확인</span>을 위해 두 번 입력한 후\n③번 <span class="orange">[팩스보내기]</span>를 눌러주세요!\n\n<span class="orange">납부확인서 팩스 전송 성공입니다!</span> 고생하셨습니다 ㅎㅎ`];
        const certSteps = [`하단의 주황색 화살표가 가리키는 <span class="orange">[발급내역 확인]</span> 버튼을 선택해주세요!`, `①번 <span class="orange">체크박스</span>를 선택한 뒤\n하단의 ②번 <span class="orange">[보내기]</span> 버튼을 눌러주세요!\n\n스마트폰 전자문서지갑으로 서류가 안전하게 발급되었습니다!`];
        const pdfSteps = [
            `스마트폰 화면 하단의 파란색 <span class="orange">[전자증명서(다운로드)]</span>를 누르신 후,\n팝업창에서 주황색 화살표의 <span class="orange">[발급내역 확인]</span> 버튼을 선택해주세요!`,
            `화살표가 가리키는 파란색 <span class="orange">[전자증명서 다운로드(PDF)]</span> 글자를 선택해주세요!`,
            `문서를 열람할 때 필요한 비밀번호를 설정할 수 있습니다.\n\n① <span class="orange">[미설정]</span>: 비밀번호 없이 바로 열기\n② <span class="orange">[확인]</span>: 생년월일 비밀번호 설정 후 열기\n\n원하시는 방식을 선택해주세요!`,
            `열람용 비밀번호 설정을 선택하셨다면\n① <span class="orange">숫자 6자리</span> 입력 후\n② 하단의 <span class="orange">[등록]</span> 버튼을 눌러주세요!`,
            `화면 하단에 다운로드 확인 창이 뜨면\n주황색 화살표의 <span class="orange">[다운로드]</span>를 선택해주세요!`,
            `<span class="orange">★ 마지막 제출 및 실물 출력 안내 ★</span>\n\n1. 스마트폰 파일 앱에서 다운로드한 제증명서를 엽니다.\n2. 화면을 캡처한 후 <span class="orange">1844-2716</span> 번호로 사진 문자를 전송합니다.\n3. 창구 직원에게 신분증을 제시하고 종이 출력물을 수령하시면 끝납니다!`
        ];

        // 6. [완납증명서] 7.png 반영 안내 문구
        const wnMainText = `주황색으로 강조 표시된 <span class="orange">①번 [보험구분]</span>을 확인하신 후 발급 방식을 선택해 주세요!\n\n- 종이로 직접 출력하시려면 -> <span class="orange">②번 [미리보기]</span> 선택\n- 팩스로 전송하시려면 -> <span class="orange">③번 [팩스]</span> 선택\n\n원하시는 발급 방식을 아래 버튼에서 눌러주세요!`;
        const wnPrintSteps = [
            `하단 좌측의 <span class="orange">[미리보기]</span>를 누르신 후,\n화면 상단 주황색 네모로 표시된 <span class="orange">[파일 저장(디스켓 모양)]</span> 아이콘을 눌러 스마트폰에 저장해주세요!`,
            `<span class="orange">★ 완납증명서 출력 및 제출 안내 ★</span>\n\n1. 파일 앱에서 다운로드한 제증명서를 엽니다.\n   (문서 비밀번호: <span class="orange">생년월일 6자리</span> 입력)\n2. 화면을 캡처한 후 <span class="orange">1844-2716</span> 번호로 사진 문자를 전송합니다.\n3. 창구 직원에게 신분증을 제시하고 종이 출력물을 수령하시면 끝납니다!`
        ];
        const wnFaxSteps = [
            `하단 우측의 <span class="orange">[팩스]</span> 버튼을 누르신 후,\n안내 화면에 따라 <span class="orange">팩스전송번호</span>를 2회 입력하고 하단의 <span class="orange">[팩스보내기]</span>를 눌러주세요!\n\n<span class="orange">완납증명서 팩스 전송 완료입니다!</span>`
        ];

        function refreshDisplay() {
            const guidePanel = document.getElementById("guidePanel");
            const phonePanel = document.getElementById("phonePanel");
            const tripleContainer = document.getElementById("tripleContainer");
            const buttonContainer = document.getElementById("buttonContainer");
            const homeGridContainer = document.getElementById("homeGridContainer");

            const allImages = document.querySelectorAll('.raw-guide-image');
            allImages.forEach(img => img.classList.remove('active'));
            tripleContainer.classList.remove('active');
            homeGridContainer.innerHTML = '';

            if (stage === 'home') {
                guidePanel.classList.add("full-width");
                phonePanel.classList.add("hidden");

                document.getElementById("stepNum").innerText = "환영합니다! 원하시는 발급 서류를 선택해주세요";
                document.getElementById("stepText").innerHTML = `바쁜 창구 대기 없이, 스마트폰으로 간편하게 3분 만에 서류를 발급받으실 수 있습니다.\n발급을 원하시는 <span class="orange">서류를 아래에서 큼직하게 터치</span>해주세요!`;

                homeGridContainer.innerHTML = `
                    <div class="home-menu-grid">
                        <div class="menu-card" onclick="startWorkflow('pay')">
                            <div class="card-icon">📄</div>
                            <div class="card-title">보험료 납부확인서</div>
                            <div class="card-desc">소득공제용 / 종합소득세 신고용 / 납부확인용 서류 발급</div>
                        </div>
                        <div class="menu-card" onclick="startWorkflow('complete')">
                            <div class="card-icon">📑</div>
                            <div class="card-title">4대 사회보험료<br>완납증명서</div>
                            <div class="card-desc">공공기관 제출용 / 은행 제출용 4대보험 체납 없는 완납 증명서</div>
                        </div>
                    </div>
                `;

                buttonContainer.innerHTML = ``;
            } else if (stage === 'common') {
                guidePanel.classList.remove("full-width");
                phonePanel.classList.remove("hidden");

                document.getElementById("stepNum").innerText = `시작 단계 ${currentSubStep} / 4`;
                document.getElementById("stepText").innerHTML = getCommonStepText(currentSubStep);

                let curImg = null;
                if (selectedDoc === 'pay') {
                    curImg = document.getElementById(`img-common-${currentSubStep}`);
                } else {
                    if (currentSubStep === 1) curImg = document.getElementById('img-common-1');
                    else if (currentSubStep === 2) curImg = document.getElementById('img-common-2');
                    else if (currentSubStep === 3) curImg = document.getElementById('img-wn-init-3');
                    else if (currentSubStep === 4) curImg = document.getElementById('img-wn-init-4');
                }

                if (curImg) curImg.classList.add('active');

                buttonContainer.innerHTML = `
                    <button class="btn btn-prev" onclick="prevStep()">이전으로</button>
                    <button class="btn btn-next" onclick="nextStep()">확인했습니다 (다음 단계)</button>
                `;
            } else if (stage === 'choice') {
                guidePanel.classList.add("full-width");
                phonePanel.classList.add("hidden");

                document.getElementById("stepNum").innerText = "로그인 방식 선택";
                document.getElementById("stepText").innerHTML = choiceStepText;

                buttonContainer.innerHTML = `
                    <button class="btn btn-prev" onclick="prevStep()">이전으로</button>
                    <button class="btn btn-choice-kakao" onclick="selectLoginPath('kakao')">간편인증 로그인</button>
                    <button class="btn btn-choice-nhis" onclick="selectLoginPath('nhis')">건강보험 인증서 발급 로그인</button>
                `;
            } else if (stage === 'kakao') {
                guidePanel.classList.remove("full-width");
                phonePanel.classList.remove("hidden");

                document.getElementById("stepNum").innerText = `간편인증 단계 ${currentSubStep} / ${kakaoSteps.length}`;
                document.getElementById("stepText").innerHTML = kakaoSteps[currentSubStep - 1];

                const curImg = document.getElementById(`img-kakao-${currentSubStep}`);
                if (curImg) curImg.classList.add('active');

                buttonContainer.innerHTML = `
                    <button class="btn btn-prev" onclick="prevStep()">이전으로</button>
                    <button class="btn btn-next" onclick="nextStep()">확인했습니다 (다음 단계)</button>
                `;
            } else if (stage === 'nhis') {
                guidePanel.classList.remove("full-width");
                phonePanel.classList.remove("hidden");

                document.getElementById("stepNum").innerText = `건강보험 인증서 단계 ${currentSubStep} / ${nhisSteps.length}`;
                document.getElementById("stepText").innerHTML = nhisSteps[currentSubStep - 1];

                if (currentSubStep === nhisSteps.length) {
                    tripleContainer.classList.add('active');
                } else {
                    const curImg = document.getElementById(`img-nhis-${currentSubStep}`);
                    if (curImg) curImg.classList.add('active');
                }

                buttonContainer.innerHTML = `
                    <button class="btn btn-prev" onclick="prevStep()">이전으로</button>
                    <button class="btn btn-next" onclick="nextStep()">확인했습니다 (다음 단계)</button>
                `;
            } else if (stage === 'pay-6') {
                guidePanel.classList.remove("full-width");
                phonePanel.classList.remove("hidden");

                document.getElementById("stepNum").innerText = "조회 및 방식 선택 (단계 6)";
                document.getElementById("stepText").innerHTML = payStep6MainText;

                const curImg = document.getElementById("img-step-6");
                if (curImg) curImg.classList.add('active');

                buttonContainer.innerHTML = `
                    <button class="btn btn-prev" onclick="prevStep()">이전으로</button>
                    <button class="btn btn-choice-fax" onclick="selectPayIssuePath('fax')">1. 팩스 전송</button>
                    <button class="btn btn-choice-cert" onclick="selectPayIssuePath('cert')">2. 전자증명서</button>
                    <button class="btn btn-choice-pdf" onclick="selectPayIssuePath('pdf')">3. PDF 발급 및 실물 출력</button>
                `;
            } else if (stage === 'fax') {
                guidePanel.classList.remove("full-width");
                phonePanel.classList.remove("hidden");

                document.getElementById("stepNum").innerText = "팩스전송 (6-1)";
                document.getElementById("stepText").innerHTML = faxSteps[0];

                const curImg = document.getElementById("img-fax-1");
                if (curImg) curImg.classList.add('active');

                buttonContainer.innerHTML = `
                    <button class="btn btn-prev" onclick="prevStep()">이전으로</button>
                    <button class="btn btn-next" onclick="resetToStart()">처음 화면으로</button>
                `;
            } else if (stage === 'cert') {
                guidePanel.classList.remove("full-width");
                phonePanel.classList.remove("hidden");

                document.getElementById("stepNum").innerText = `전자증명서 발급 단계 ${currentSubStep} / ${certSteps.length}`;
                document.getElementById("stepText").innerHTML = certSteps[currentSubStep - 1];

                const curImg = document.getElementById(`img-cert-${currentSubStep}`);
                if (curImg) curImg.classList.add('active');

                if (currentSubStep < certSteps.length) {
                    buttonContainer.innerHTML = `
                        <button class="btn btn-prev" onclick="prevStep()">이전으로</button>
                        <button class="btn btn-next" onclick="nextStep()">확인했습니다 (다음 단계)</button>
                    `;
                } else {
                    buttonContainer.innerHTML = `
                        <button class="btn btn-prev" onclick="prevStep()">이전으로</button>
                        <button class="btn btn-next" onclick="resetToStart()">처음 화면으로</button>
                    `;
                }
            } else if (stage === 'pdf') {
                guidePanel.classList.remove("full-width");
                phonePanel.classList.remove("hidden");

                document.getElementById("stepNum").innerText = `PDF 발급 및 실물 출력 단계 ${currentSubStep} / ${pdfSteps.length}`;
                document.getElementById("stepText").innerHTML = pdfSteps[currentSubStep - 1];

                const curImg = document.getElementById(`img-pdf-${currentSubStep}`);
                if (curImg) curImg.classList.add('active');

                if (currentSubStep < pdfSteps.length) {
                    buttonContainer.innerHTML = `
                        <button class="btn btn-prev" onclick="prevStep()">이전으로</button>
                        <button class="btn btn-next" onclick="nextStep()">확인했습니다 (다음 단계)</button>
                    `;
                } else {
                    buttonContainer.innerHTML = `
                        <button class="btn btn-prev" onclick="prevStep()">이전으로</button>
                        <button class="btn btn-next" onclick="resetToStart()">처음 화면으로</button>
                    `;
                }
            } else if (stage === 'wn-main') {
                guidePanel.classList.remove("full-width");
                phonePanel.classList.remove("hidden");

                document.getElementById("stepNum").innerText = "완납증명서 발급 방식 선택";
                document.getElementById("stepText").innerHTML = wnMainText;

                const curImg = document.getElementById("img-wn-main");
                if (curImg) curImg.classList.add('active');

                buttonContainer.innerHTML = `
                    <button class="btn btn-prev" onclick="prevStep()">이전으로</button>
                    <button class="btn btn-choice-pdf" onclick="selectWnIssuePath('print')">② 미리보기 (실물 종이 출력)</button>
                    <button class="btn btn-choice-fax" onclick="selectWnIssuePath('fax')">③ 팩스 전송</button>
                `;
            } else if (stage === 'wn-print') {
                guidePanel.classList.remove("full-width");
                phonePanel.classList.remove("hidden");

                document.getElementById("stepNum").innerText = `완납증명서 실물 출력 단계 ${currentSubStep} / ${wnPrintSteps.length}`;
                document.getElementById("stepText").innerHTML = wnPrintSteps[currentSubStep - 1];

                const curImg = document.getElementById(`img-wn-print-${currentSubStep}`);
                if (curImg) curImg.classList.add('active');

                if (currentSubStep < wnPrintSteps.length) {
                    buttonContainer.innerHTML = `
                        <button class="btn btn-prev" onclick="prevStep()">이전으로</button>
                        <button class="btn btn-next" onclick="nextStep()">확인했습니다 (다음 단계)</button>
                    `;
                } else {
                    buttonContainer.innerHTML = `
                        <button class="btn btn-prev" onclick="prevStep()">이전으로</button>
                        <button class="btn btn-next" onclick="resetToStart()">처음 화면으로</button>
                    `;
                }
            } else if (stage === 'wn-fax') {
                guidePanel.classList.remove("full-width");
                phonePanel.classList.remove("hidden");

                document.getElementById("stepNum").innerText = "완납증명서 팩스 전송";
                document.getElementById("stepText").innerHTML = wnFaxSteps[0];

                const curImg = document.getElementById("img-wn-fax");
                if (curImg) curImg.classList.add('active');

                buttonContainer.innerHTML = `
                    <button class="btn btn-prev" onclick="prevStep()">이전으로</button>
                    <button class="btn btn-next" onclick="resetToStart()">처음 화면으로</button>
                `;
            }
        }

        function startWorkflow(docType) {
            selectedDoc = docType;
            stage = 'common';
            currentSubStep = 1;
            refreshDisplay();
        }

        function selectLoginPath(chosenPath) {
            loginMethod = chosenPath;
            stage = chosenPath;
            currentSubStep = 1;
            refreshDisplay();
        }

        function selectPayIssuePath(chosenIssue) {
            stage = chosenIssue;
            currentSubStep = 1;
            refreshDisplay();
        }

        function selectWnIssuePath(chosenIssue) {
            if (chosenIssue === 'print') {
                stage = 'wn-print';
            } else {
                stage = 'wn-fax';
            }
            currentSubStep = 1;
            refreshDisplay();
        }

        function nextStep() {
            if (stage === 'common') {
                if (currentSubStep < 4) {
                    currentSubStep++;
                } else {
                    stage = 'choice';
                }
            } else if (stage === 'kakao') {
                if (currentSubStep < kakaoSteps.length) {
                    currentSubStep++;
                } else {
                    stage = (selectedDoc === 'pay') ? 'pay-6' : 'wn-main';
                }
            } else if (stage === 'nhis') {
                if (currentSubStep < nhisSteps.length) {
                    currentSubStep++;
                } else {
                    stage = (selectedDoc === 'pay') ? 'pay-6' : 'wn-main';
                }
            } else if (stage === 'cert') {
                if (currentSubStep < certSteps.length) {
                    currentSubStep++;
                }
            } else if (stage === 'pdf') {
                if (currentSubStep < pdfSteps.length) {
                    currentSubStep++;
                }
            } else if (stage === 'wn-print') {
                if (currentSubStep < wnPrintSteps.length) {
                    currentSubStep++;
                }
            }
            refreshDisplay();
        }

        function prevStep() {
            if (stage === 'common') {
                if (currentSubStep > 1) {
                    currentSubStep--;
                } else {
                    stage = 'home';
                }
            } else if (stage === 'choice') {
                stage = 'common';
                currentSubStep = 4;
            } else if (stage === 'kakao' || stage === 'nhis') {
                if (currentSubStep > 1) {
                    currentSubStep--;
                } else {
                    stage = 'choice';
                }
            } else if (stage === 'pay-6' || stage === 'wn-main') {
                if (loginMethod === 'kakao') {
                    stage = 'kakao';
                    currentSubStep = kakaoSteps.length;
                } else {
                    stage = 'nhis';
                    currentSubStep = nhisSteps.length;
                }
            } else if (stage === 'fax') {
                stage = 'pay-6';
            } else if (stage === 'cert') {
                if (currentSubStep > 1) {
                    currentSubStep--;
                } else {
                    stage = 'pay-6';
                }
            } else if (stage === 'pdf') {
                if (currentSubStep > 1) {
                    currentSubStep--;
                } else {
                    stage = 'pay-6';
                }
            } else if (stage === 'wn-print') {
                if (currentSubStep > 1) {
                    currentSubStep--;
                } else {
                    stage = 'wn-main';
                }
            } else if (stage === 'wn-fax') {
                stage = 'wn-main';
            }
            refreshDisplay();
        }

        function resetToStart() {
            stage = 'home';
            currentSubStep = 1;
            refreshDisplay();
        }

        window.onload = function() {
            refreshDisplay();
        };
    </script>
</body>
</html>
